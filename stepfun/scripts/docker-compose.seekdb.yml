version: '3.8'

services:
  seekdb:
    image: oceanbase/seekdb:latest
    container_name: seekdb-server
    ports:
      - "2881:2881"
    environment:
      - SEEKDB_DATABASE=stepfun_kb
      - SEEKDB_USER=root
      - SEEKDB_PASSWORD=
    volumes:
      - seekdb_data:/var/lib/seekdb
    restart: unless-stopped

volumes:
  seekdb_data:
