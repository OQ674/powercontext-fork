    - data:
        code: "import json\nimport re\n\n\ndef _json(text, default):\n    if text\
          \ is None:\n        return default\n    if isinstance(text, (dict, list)):\n\
          \        return text\n    s = str(text).strip()\n    if s.startswith(\"\
          ```\"):\n        s = re.sub(r\"^```[a-zA-Z]*\\s*\", \"\", s)\n        s\
          \ = re.sub(r\"\\s*```$\", \"\", s)\n    match = re.search(r\"\\{.*\\}\"\
          , s, re.S)\n    if match:\n        s = match.group(0)\n    try:\n      \
          \  return json.loads(s)\n    except Exception:\n        return default\n\
          \n\ndef main(llm_text: str, state_raw: str, props_raw: str) -> dict:\n \
          \   state_pack = _json(state_raw, {})\n    state = state_pack.get(\"state\"\
          , {}) if isinstance(state_pack, dict) else {}\n    payload = _json(llm_text,\
          \ {})\n    if not isinstance(payload, dict):\n        payload = {}\n\n \
          \   reply = str(payload.get(\"reply\") or llm_text or \"……\").strip()\n\
          \    ledger = str(payload.get(\"ledger\") or \"又记了一笔\")[:40]\n    prop_used\
          \ = str(payload.get(\"prop_used\") or \"\")\n    try:\n        gd = int(payload.get(\"\
          grudge_delta\") or 0)\n    except Exception:\n        gd = 0\n    try:\n\
          \        md = int(payload.get(\"mood_delta\") or 0)\n    except Exception:\n\
          \        md = 0\n\n    base_g = int(state.get(\"grudge\") or 0)\n    base_m\
          \ = int(state.get(\"mood\") or 60)\n    turn_no = int(state.get(\"turn_no\"\
          ) or 0) + 1\n    grudge = max(0, min(100, base_g + gd))\n    mood = max(0,\
          \ min(100, base_m + md))\n\n    filled = grudge // 10\n    bar = \"#\" *\
          \ filled + \"-\" * (10 - filled)\n    prop_line = (\"\\n\U0001F527 本轮道具：\"\
          \ + prop_used) if prop_used else \"\"\n    panel = (\n        \"\\n\\n———\\\
          n\"\n        \"\U0001F37A 老陈的记仇本  [\" + bar + \"]  \" + str(grudge) + \"\
          /100\\n\"\n        \"\U0001F642 心情 \" + str(mood) + \"/100 ｜ 第 \" + str(turn_no)\
          \ + \" 回合 ｜ 记在账上：\" + ledger\n        + prop_line\n    )\n    if 60 <= grudge\
          \ < 100:\n        panel += \"\\n⚠️ 老陈开始翻账本了。\"\n\n    final_text = reply\
          \ + panel\n    ending = \"yes\" if grudge >= 100 else \"no\"\n\n    ending_text\
          \ = (\n        \"（老陈把抹布搭在肩上，走到门口，把「营业中」的牌子翻了过去。）\\n\\n\"\n        \"「第 \"\
          \ + str(turn_no) + \" 回合。\" + ledger + \"……我都记着。」\\n\\n\"\n        \"他从吧台下面拖出一个纸箱：盐罐、气球、弹珠、那副假牙，每一件上面都贴着日期。\\\
          n\"\n        \"「今晚这杯，我请你。」\\n\\n\"\n        \"———\\n\"\n        \"\U0001F3C1\
          \ 结局【打烊后的清算】\\n\"\n        \"记仇 100/100 ｜ 共 \" + str(turn_no) + \" 回合 ｜\
          \ 心情 \" + str(mood) + \"/100\\n\"\n        \"（灯灭了。明天，酒馆照常营业。）\"\n    )\n\
          \n    return {\n        \"reply\": reply,\n        \"ledger\": ledger,\n\
          \        \"prop_used\": prop_used,\n        \"grudge\": grudge,\n      \
          \  \"mood\": mood,\n        \"ending\": ending,\n        \"final_text\"\
          : final_text,\n        \"ending_text\": ending_text,\n    }"
        code_language: python3
        desc: 解析 LLM 的 JSON，结算记仇值与心情，拼出状态面板与结局文案
